# Single-binary Loki, filesystem storage, 72h retention. Logs here exist to
# explain what a metric panel already showed, so a long history would cost
# memory and disk on a shared node without answering new questions.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
    max_streams_per_user: 2000
    reject_old_samples: true
    reject_old_samples_max_age: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 3Gi
  resources:
    requests: { cpu: 30m, memory: 128Mi }
    limits: { memory: 256Mi }

# Everything below is the chart's distributed topology; single binary needs none.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
resultsCache: { enabled: false }
chunksCache: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
  serviceMonitor: { enabled: false }
