# Descriptive metadata for the cluster's namespaces. Names follow ecosystem
# conventions on purpose (argocd, cert-manager, monitoring are what every
# tool and doc assume); the description annotation is where the human
# context lives. Prune=false: deleting a line here must never delete a
# namespace and everything in it.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      Observability stack (kube-prometheus-stack): Prometheus, Grafana with
      the curated Homelab Overview dashboard, exporters. Public Grafana at
      grafana.lab.csharpkit.com.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      TLS automation: cert-manager issuing and renewing Let's Encrypt
      certificates for every ingress host via HTTP-01.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      GitOps control plane: ArgoCD watches github.com/geffzhang/cloudhomelab and
      keeps this cluster matching it. UI at argo.lab.csharpkit.com.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: 9router
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      9Router: self-hosted AI gateway providing rate-limit fallback for
      Claude Code across 40+ providers. Holds subscription OAuth tokens and
      issued API keys on its PVC. Public at 9router.lab.csharpkit.com.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      OpenSandbox 1.1 control plane: controller, lifecycle API server,
      ingress gateway, and in-cluster OCI registry used for sandbox
      pause/resume snapshots. Public API at sandbox.lab.csharpkit.com.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      OpenSandbox 1.1 sandbox workload namespace. Pool and BatchSandbox
      custom resources land here; sandbox Pods run in this namespace by
      default (matches the chart's [kubernetes].namespace default).
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      Shared platform PostgreSQL service (Bitnami chart, currently PG 17.6.0;
      see ADR-008 for the v1 deviation from the originally-planned PG 18).
      Hosts databases/users consumed by platform apps; first consumer is
      the Keycloak `keycloak` database/user.
  labels:
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    homelab.csharpkit.com/description: >-
      Keycloak 26.8 OIDC identity provider (operator-managed). Hosts the
      Keycloak server StatefulSet and the `homelab` realm import. Public
      admin console at keycloak.lab.csharpkit.com.
  labels:
    app.kubernetes.io/part-of: homelab
