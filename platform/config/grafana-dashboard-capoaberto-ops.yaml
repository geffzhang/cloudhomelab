              },
              "expr": "(histogram_quantile(0.95, sum by (le) (rate(capoaberto_http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))) or vector(0)",
              "refId": "B",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(histogram_quantile(0.99, sum by (le) (rate(capoaberto_http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))) or vector(0)",
              "refId": "C",
