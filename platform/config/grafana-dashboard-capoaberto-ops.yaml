          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(capoaberto_http_requests_total{namespace=\"$namespace\"}[5m])) * 60) or vector(0)",
              "refId": "A",
              "instant": true
