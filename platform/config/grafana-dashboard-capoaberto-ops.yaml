          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(capoaberto_http_requests_total{namespace=\"$namespace\", status_class=\"5xx\"}[5m])) / clamp_min(sum(rate(capoaberto_http_requests_total{namespace=\"$namespace\"}[5m])), 0.0001)) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "noValue": "0"
          },
          "id": 106
        },
        {
          "type": "stat",
          "title": "Latência p95",
          "description": "95% das respostas abaixo deste tempo.",
          "datasource": {
            "type": "prometheus",
