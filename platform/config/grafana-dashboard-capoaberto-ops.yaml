apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-capoaberto-ops
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  capoaberto-ops.json: |
    {
      "uid": "capoaberto-ops",
      "title": "Capô Aberto · Operação",
      "tags": [
        "capoaberto",
        "ops"
      ],
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "timezone": "browser",
      "schemaVersion": 39,
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "label": "Fonte"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(kube_namespace_created{namespace=~\"capoaberto.*\"}, namespace)",
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "label": "Ambiente",
            "current": {
              "text": "capoaberto-staging",
              "value": "capoaberto-staging"
            },
            "description": "capoaberto-staging e HML. capoaberto passa a aparecer quando o namespace de producao existir."
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Saúde do serviço",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "API disponível",
          "description": "1 quando o Prometheus consegue coletar a API.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(up{namespace=\"$namespace\", service=\"api\"})) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "noValue": "0"
          },
          "id": 102
        },
        {
          "type": "stat",
          "title": "Pods prontos",
          "description": "Replicas prontas de web e API.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(kube_deployment_status_replicas_ready{namespace=\"$namespace\"})) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "noValue": "0"
          },
          "id": 103
        },
        {
          "type": "stat",
          "title": "Reinícios 24h",
          "description": "Reinicios de container no periodo.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[24h]))) or vector(0)",
              "refId": "A",
              "instant": true
