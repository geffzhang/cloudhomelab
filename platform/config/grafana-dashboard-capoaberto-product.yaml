            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "label": "Fonte"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(kube_namespace_created{namespace=~\"capoaberto.*\"}, namespace)",
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "label": "Ambiente",
            "current": {
              "text": "capoaberto-staging",
              "value": "capoaberto-staging"
            },
            "description": "capoaberto-staging e HML. capoaberto passa a aparecer quando o namespace de producao existir."
