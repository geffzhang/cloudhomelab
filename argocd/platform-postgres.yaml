---
# Shared platform PostgreSQL (vendored Bitnami chart, currently PG 17.6.0).
# Wave 1: needs no CRDs, but Keycloak (wave 2) depends on this being
# Ready. The chart is vendored in this repo to avoid ArgoCD fetching its
# OCI-hosted archive; values and SealedSecret remain separate Git sources.
# releaseName is fixed so the service FQDN stays stable across upgrades.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/geffzhang/cloudhomelab
      targetRevision: main
      path: platform/postgres/chart
      helm:
        releaseName: keycloak-postgres
        valueFiles:
          - $values/platform/postgres/values.yaml
    - repoURL: https://github.com/geffzhang/cloudhomelab
      targetRevision: main
      ref: values
    # SealedSecret supplying admin + keycloak DB passwords lives at
    # apps/postgres/sealed-credentials.yaml. Without this third source
    # ArgoCD never reconciles the SealedSecret, the Bitnami chart's
    # `existingSecret: postgres-credentials` resolves to nothing, and
    # Keycloak's db.password secretKeyRef stays unsatisfied.
    - repoURL: https://github.com/geffzhang/cloudhomelab
      targetRevision: main
      path: apps/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true