apiVersion: v1
kind: Service
metadata:
  name: opensandbox-ingress-gateway
  namespace: opensandbox-system
  labels:
    helm.sh/chart: ingress-gateway-1.1.0
    app.kubernetes.io/name: opensandbox-ingress-gateway
    app.kubernetes.io/instance: ingress-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ingress-gateway
    app.kubernetes.io/part-of: opensandbox
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 28888
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: opensandbox-ingress-gateway
    app.kubernetes.io/instance: ingress-gateway
---
# Source: ingress-gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-ingress-gateway
  namespace: opensandbox-system
  labels:
    helm.sh/chart: ingress-gateway-1.1.0
    app.kubernetes.io/name: opensandbox-ingress-gateway
    app.kubernetes.io/instance: ingress-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ingress-gateway
    app.kubernetes.io/part-of: opensandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-ingress-gateway
      app.kubernetes.io/instance: ingress-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-ingress-gateway
        app.kubernetes.io/instance: ingress-gateway
        app.kubernetes.io/component: ingress-gateway
        app.kubernetes.io/part-of: opensandbox
    spec:
      serviceAccountName: opensandbox-ingress-gateway
      containers:
        - name: main
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/ingress:release-1.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--namespace=opensandbox"
            - "--port=28888"
            - "--provider-type=batchsandbox"
            - "--mode=header"
            - "--log-level=info"
          ports:
            - name: http
              containerPort: 28888
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status.ok
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.ok
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
