apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
  labels:
    helm.sh/chart: opensandbox-server-1.1.0
    app.kubernetes.io/name: opensandbox-server
    app.kubernetes.io/instance: opensandbox-server
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: opensandbox-server
    app.kubernetes.io/part-of: opensandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-server
      app.kubernetes.io/instance: opensandbox-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-server
        app.kubernetes.io/instance: opensandbox-server
        app.kubernetes.io/part-of: opensandbox
      annotations:
        # The server parses config.toml once at startup, so an in-place update
        # of the ConfigMap leaves the running pod on the previous configuration.
        # Hashing the rendered TOML rolls the Deployment whenever it changes.
        checksum/config: 306304832ae365b5ee9ac802b98d46d9ccd725e81eceac84a1c95ba0cd8f2040
    spec:
      serviceAccountName: opensandbox-server
      containers:
        - name: main
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/server:release-1.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/opensandbox/config.toml"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: SANDBOX_CONFIG_PATH
              value: "/etc/opensandbox/config.toml"
            - name: OPENSANDBOX_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: opensandbox-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox/config.toml
              subPath: config.toml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: config
          configMap:
            name: opensandbox-server-config
