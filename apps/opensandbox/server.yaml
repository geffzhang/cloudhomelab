apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-server-config
  namespace: opensandbox-system
  labels:
    helm.sh/chart: opensandbox-server-1.1.0
    app.kubernetes.io/name: opensandbox-server
    app.kubernetes.io/instance: opensandbox-server
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: opensandbox-server
    app.kubernetes.io/part-of: opensandbox
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 80
    api_key = ""
    
    [log]
    level = "INFO"
    
    [runtime]
    type = "kubernetes"
    execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.1.0"
    
    [kubernetes]
    kubeconfig_path = ""
    namespace = "opensandbox"
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/opensandbox/example.batchsandbox-template.yaml"
    
    [egress]
    image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:release-1.1.0"
    mode = "dns+nft"
    
    
    [ingress]
    mode = "gateway"
    
    gateway.address = "sandbox.lab.csharpkit.com"
    gateway.route.mode = "uri"
---
# Source: opensandbox-server/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensandbox-server-role
  labels:
    helm.sh/chart: opensandbox-server-1.1.0
    app.kubernetes.io/name: opensandbox-server
    app.kubernetes.io/instance: opensandbox-server
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: opensandbox-server
    app.kubernetes.io/part-of: opensandbox
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log", "events", "services", "configmaps"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "batchsandboxes/status", "batchsandboxes/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["pools", "pools/status", "pools/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["sandboxsnapshots", "sandboxsnapshots/status", "sandboxsnapshots/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Fsb: Sandbox CR reads power Get/List; SandboxTemplate
  # CRUD powers the /templates management API; SandboxSnapshot
  # watches power fsb snapshot status convergence.
  - apiGroups: ["sandbox.fast.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sandbox.fast.io"]
    resources: ["sandboxtemplates"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["sandbox.fast.io"]
    resources: ["sandboxesnapshots"]
    verbs: ["get", "list", "watch"]
