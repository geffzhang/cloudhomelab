apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: capoaberto
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capoaberto
  namespace: capoaberto
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: capoaberto.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 3000 }
  tls:
    - hosts: [capoaberto.com.br]
      secretName: capoaberto-br-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capoaberto-api
  namespace: capoaberto
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: capoaberto-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: capoaberto.com.br
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 3001 }
  tls:
    - hosts: [capoaberto.com.br]
      secretName: capoaberto-br-tls
