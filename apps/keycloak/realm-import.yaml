---
# One-shot realm import: creates the `homelab` realm, the
# `homelab-admin` user with realm-admin role, and four OIDC
# clients (argocd / grafana / 9router / opensandbox). Each client is
# confidential with a sealed secret; admin password is sealed too.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    ADMIN_PASSWORD:
      secret:
        name: homelab-secrets
        key: admin-password
    ARGOCD_CLIENT_SECRET:
      secret:
        name: homelab-secrets
        key: argocd-client-secret
    GRAFANA_CLIENT_SECRET:
      secret:
        name: homelab-secrets
        key: grafana-client-secret
    NINEROUTER_CLIENT_SECRET:
      secret:
        name: homelab-secrets
        key: 9router-client-secret
    OPENSANDBOX_CLIENT_SECRET:
      secret:
        name: homelab-secrets
        key: opensandbox-client-secret
  realm:
    realm: homelab
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    rememberMe: true
    internationalizationEnabled: false
    ssoSessionIdleTimeout: 28800
    accessTokenLifespan: 1800
    users:
      - username: homelab-admin
        enabled: true
        emailVerified: true
        realmRoles:
          - realm-admin
        credentials:
          - type: password
            value: ${ADMIN_PASSWORD}
    clients:
      - clientId: argocd
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: https://argo.${CLUSTER_DOMAIN}
        baseUrl: /
        redirectUris:
          - https://argo.${CLUSTER_DOMAIN}/auth/callback
        webOrigins:
          - https://argo.${CLUSTER_DOMAIN}
        secret: ${ARGOCD_CLIENT_SECRET}
      - clientId: grafana
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: https://grafana.${CLUSTER_DOMAIN}
        baseUrl: /
        redirectUris:
          - https://grafana.${CLUSTER_DOMAIN}/login/generic_oauth
        webOrigins:
          - https://grafana.${CLUSTER_DOMAIN}
        secret: ${GRAFANA_CLIENT_SECRET}
      - clientId: 9router
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: https://9router.${CLUSTER_DOMAIN}
        baseUrl: /
        redirectUris:
          - https://9router.${CLUSTER_DOMAIN}/auth/callback
        webOrigins:
          - https://9router.${CLUSTER_DOMAIN}
        secret: ${NINEROUTER_CLIENT_SECRET}
      - clientId: opensandbox
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: https://sandbox.${CLUSTER_DOMAIN}
        baseUrl: /
        redirectUris:
          - https://sandbox.${CLUSTER_DOMAIN}/auth/callback
        webOrigins:
          - https://sandbox.${CLUSTER_DOMAIN}
        secret: ${OPENSANDBOX_CLIENT_SECRET}