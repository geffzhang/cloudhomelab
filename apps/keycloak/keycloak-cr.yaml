---
# Keycloak 26.8 instance. Reconciles a single StatefulSet; the operator
# fills the rest (Service, ServiceMonitor opt-in, etc.). host +
# proxy + http.tls are the Traefik passthrough config: Traefik
# terminates TLS, forwards plain HTTP, Keycloak trusts X-Forwarded-*.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  hostname:
    hostname: https://keycloak.${CLUSTER_DOMAIN}
    admin: https://keycloak.${CLUSTER_DOMAIN}
    strict: false
  proxy:
    headers: xforwarded
  features:
    enabled:
      - persistent-user-sessions
  db:
    vendor: postgres
    host: keycloak-postgres-postgresql.database.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: postgres-credentials
      key: username
    passwordSecret:
      name: postgres-credentials
      key: keycloak-password
  http:
    httpEnabled: true
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi