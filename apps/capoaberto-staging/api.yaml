apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/originlabsbr/capoaberto-api:7e877b801cbbbfbe2683e2bcbf9d0adac5d9f82b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            # Sandbox sends the supplier's homolog flag: it exercises the real
            # request path against real modules, returns fixed data, and is
            # neither billed nor counted against the account balance.
            - name: VEHICLE_PROVIDER_MODE
              value: api-brasil-sandbox
            - name: API_BRASIL_BEARER_TOKEN
              valueFrom:
                secretKeyRef: { name: capoaberto-api-brasil, key: API_BRASIL_BEARER_TOKEN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
            # Asaas is the active gateway in staging; AbacatePay stays in the
            # build so a rollback is this value plus a restart.
            - name: PAYMENT_PROVIDER
              value: asaas
            - name: ASAAS_ENV
              value: sandbox
            - name: ASAAS_USER_AGENT
              value: capoaberto
            - name: ASAAS_API_KEY
              valueFrom:
                secretKeyRef: { name: capoaberto-asaas, key: ASAAS_API_KEY }
            - name: ASAAS_WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: capoaberto-asaas, key: ASAAS_WEBHOOK_AUTH_TOKEN }
            - name: ABACATEPAY_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-api-key } }
            - name: ABACATEPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-webhook-secret } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: resend-api-key } }
            - name: EMAIL_FROM
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: email-from } }
            # Transactional mail is sent from a noreply address, so without
            # this a reply to a report reaches a mailbox nobody reads. Not a
            # secret: the address is published on the site.
            - name: EMAIL_REPLY_TO
              value: contato@capoaberto.com.br
            - name: APP_URL
              value: https://staging.capoaberto.com.br
            - name: API_URL
              value: http://api:3001
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3001 }]
---
# Prometheus scrapes /metrics from inside the cluster. The ingress never routes
# to it, so the endpoint stays private while Prometheus still reaches it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capoaberto-api
  namespace: capoaberto-staging
  labels:
    release: monitoring
spec:
  selector:
    matchLabels: { app: api }
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
  namespaceSelector:
    matchNames: [capoaberto-staging]
