---
# SealedSecret placeholder for the shared platform PostgreSQL service.
# Encrypted data is filled in during the second PR (see
# docs/operations/adding-keycloak.md#sealing-the-postgresql-credentials).
# Without this file existing, Bitnami's existingSecret lookup fails and
# the chart auto-generates throwaway passwords; the Keycloak CR's
# secretKeyRef then resolves once encrypted data lands.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: database
spec:
  encryptedData: {}
  template:
    metadata:
      name: postgres-credentials
      namespace: database